name: Build and Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Show build artifacts
        run: |
          echo "=== 体积对比 ==="
          echo -n "thin jar (业务代码): "; du -h target/commercehub.jar | cut -f1
          echo -n "exec jar (含依赖):   "; du -h target/commercehub-exec.jar | cut -f1
          echo -n "lib 目录 (依赖包):   "; du -sh target/lib | cut -f1

      - name: Upload thin jar (业务代码)
        uses: actions/upload-artifact@v4
        with:
          name: commercehub-thin
          path: target/commercehub.jar
          retention-days: 7

      - name: Upload exec jar (可直接运行)
        uses: actions/upload-artifact@v4
        with:
          name: commercehub-exec
          path: target/commercehub-exec.jar
          retention-days: 7

      - name: Upload lib (依赖包)
        uses: actions/upload-artifact@v4
        with:
          name: commercehub-lib
          path: target/lib/*.jar
          retention-days: 7

  # ====== 部署 thin jar 到服务器 ======
  # 需要在 仓库 Settings → Secrets and variables → Actions 配置：
  #   SERVER_HOST     服务器IP/域名
  #   SERVER_PORT     SSH端口(如22)
  #   SERVER_USER     SSH用户(如root)
  #   SERVER_SSH_KEY  SSH私钥内容(ed25519或rsa)
  #   DEPLOY_PATH     部署目录(如/opt/commercehub)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 只有配了 SERVER_HOST 才执行部署
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download thin jar
        uses: actions/download-artifact@v4
        with:
          name: commercehub-thin
          path: artifact

      - name: Prepare deploy files
        run: |
          mkdir -p deploy
          cp artifact/commercehub.jar deploy/
          cp scripts/start.sh deploy/

      - name: Upload thin jar + start script (只传业务代码，几十KB)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/commercehub.jar,deploy/start.sh"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            DEPLOY_PATH=${{ secrets.DEPLOY_PATH }} bash start.sh
