name: Build and Deploy

on:
  push:
    branches: [ main, master ]

jobs:
  # ====== 构建校验（在 GitHub Runner 上编译，确保代码能过编译）======
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package -DskipTests

      - name: Show build artifacts
        run: |
          echo "=== 体积对比 ==="
          echo -n "thin jar (业务代码): "; du -h target/commercehub.jar | cut -f1
          echo -n "exec jar (含依赖):   "; du -h target/commercehub-exec.jar | cut -f1
          echo -n "lib 目录 (依赖包):   "; du -sh target/lib | cut -f1

      - name: Upload thin jar (业务代码)
        uses: actions/upload-artifact@v4
        with:
          name: commercehub-thin
          path: target/commercehub.jar
          retention-days: 7

      - name: Upload exec jar (可直接运行)
        uses: actions/upload-artifact@v4
        with:
          name: commercehub-exec
          path: target/commercehub-exec.jar
          retention-days: 7

  # ====== 部署：SSH 到服务器，服务器自己 git pull + 编译 + 重启 ======
  # 需要在 仓库 Settings → Secrets and variables → Actions 配置：
  #   SERVER_HOST     服务器IP/域名
  #   SERVER_PORT     SSH端口(如22)
  #   SERVER_USER     SSH用户(如root)
  #   SERVER_SSH_KEY  SSH私钥内容(ed25519或rsa)
  #   DEPLOY_PATH     部署目录(如/opt/commercehub，须已 git clone 仓库)
  # 以及 Variables：
  #   ENABLE_DEPLOY   设为 true 才触发部署
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_DEPLOY == 'true' }}

    steps:
      - name: Trigger server-side deploy (git pull + mvn package + restart)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 远程执行部署脚本；设长超时，首次编译会下载依赖较慢
          command_timeout: 30m
          script: |
            DEPLOY_PATH=${{ secrets.DEPLOY_PATH }} bash ${{ secrets.DEPLOY_PATH }}/scripts/deploy.sh
