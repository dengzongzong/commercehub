server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: commerce-app
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:commerce}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.example.commerce: INFO

# ====== 支付 ======
pay:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    mch-id: ${WECHAT_MCH_ID:}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    cert-serial-no: ${WECHAT_CERT_SERIAL_NO:}
    private-key: ${WECHAT_PRIVATE_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:}

# ====== 物流 ======
logistics:
  kdniao:
    ebusiness-id: ${KDNIAO_EBUSINESS_ID:}
    api-key: ${KDNIAO_API_KEY:}

# ====== 短信 ======
sms:
  aliyun:
    access-key-id: ${ALIYUN_AK:}
    access-key-secret: ${ALIYUN_SK:}
    sign-name: ${ALIYUN_SIGN:}

# ====== 实名认证(支付宝) ======
cert:
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com/gateway.do}
    return-url: ${CERT_RETURN_URL:}
